<!doctype html>
<html lang="zh-CN" class="kid-view-code">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scratch 3 创作室</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #scratch{height:100%}
  #boot{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#F6F4FF;
    color:#5C63DD;font:15px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
  #boot .sp{width:34px;height:34px;border-radius:50%;
    border:3px solid #D9D4FF;border-top-color:#6E56CF;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 桌面版菜单栏（文件 / 编辑 / 教程 / 语言）在手机上只会误触，藏起来换成 App 的大按钮 */
  [class*="menu-bar_menu-bar_"]{display:none !important}
  /* 舞台左上角那几个小图标（舞台大小、全屏）对小孩也过于隐蔽，一并收掉 */
  [class*="stage-header_stage-size-row_"],
  [class*="stage-header_control-buttons_"]{display:none !important}
  /* 触屏上放大素材库/造型库的列表项，原来 96px 太小不好点 */
  [class*="library-item_library-item_"]{min-width:104px !important;min-height:104px !important}

  /* 菜单栏被藏起来后，body 还留着 48px 的空档，退回来给编辑区 */
  [class*="gui_body-wrapper_"]{height:100% !important}
  html.kid-view-code [class*="gui_body-wrapper_"],
  html.kid-view-sprite [class*="gui_body-wrapper_"]{
    display:flex !important;flex-direction:column !important}

  /* ═══ 视图一：积木（默认）═══════════════════════════════
     手机横屏 780 宽，而 Scratch 的布局是「积木 598 + 舞台 426 = 1024」，
     舞台那一列会被整个推到屏幕外，怎么滑都看不到。所以编辑时把角色条和舞台
     一起收掉，宽度和高度全给积木；要看角色点「角色」，要看效果点「舞台」。 */
  html.kid-view-code [class*="gui_editor-wrapper_"]{
    flex:1 1 auto !important;flex-basis:auto !important;width:100% !important;
    min-width:0 !important;min-height:0 !important}
  /* 舞台这一列高度压成 0。舞台本身是屏幕外的绝对定位元素，自带 410×310 的
     固定尺寸，所以 canvas 的绘制缓冲不会缩成 0×0（缩成 0 再切回来就是一片白）。 */
  html.kid-view-code [class*="stage-and-target-wrapper_"]{
    flex:0 0 0 !important;width:100% !important;height:0 !important;min-height:0 !important;
    padding:0 !important;overflow:hidden !important;position:relative !important}
  html.kid-view-code [class*="stage-wrapper_stage-wrapper_"]{
    position:absolute !important;left:-10000px !important;top:0 !important;
    display:block !important}

  /* ═══ 视图二：角色（全屏列表，点一下就去改它）═══════════
     注意：编辑器本身不隐藏，只是被这一层盖住。把它 display:none 会让 Blockly
     重新算尺寸、把滚动位置重置，切回来积木会突然跳一段（还会钻到调色板底下）。
     z-index 用 400：素材库弹窗是 501/510，得压在它上面。 */
  html.kid-view-sprite [class*="stage-and-target-wrapper_"]{
    position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;
    z-index:400 !important;margin:0 !important;padding:0 !important;
    display:flex !important;flex-direction:column !important;background:#F6F4FF !important}
  html.kid-view-sprite [class*="stage-wrapper_stage-wrapper_"]{
    position:absolute !important;left:-10000px !important;top:0 !important;
    display:block !important}
  html.kid-view-sprite [class*="gui_target-wrapper_"]{
    flex:1 1 auto !important;width:100% !important;height:auto !important;
    min-height:0 !important;margin:0 !important;padding:0 !important;display:flex !important}
  html.kid-view-sprite [class*="target-pane_target-pane_"]{
    display:flex !important;flex-direction:column !important;
    width:100% !important;height:100% !important;min-height:0 !important}
  html.kid-view-sprite [class*="sprite-selector_sprite-selector_"]{
    flex:1 1 auto !important;min-height:0 !important;margin:0 !important;
    border:0 !important;border-radius:0 !important;background:#F6F4FF !important;
    display:flex !important;flex-direction:column !important}
  /* 舞台 / 角色的 x、y、大小数字面板：小孩用不到，藏掉 */
  html.kid-view-sprite [class^="sprite-info_sprite-info_"]{display:none !important}
  html.kid-view-sprite [class*="sprite-selector_scroll-wrapper_"]{
    flex:1 1 auto !important;height:auto !important;min-height:0 !important;
    overflow-y:auto !important;overflow-x:hidden !important;
    -webkit-overflow-scrolling:touch !important}
  html.kid-view-sprite [class*="sprite-selector_items-wrapper_"]{
    display:flex !important;flex-direction:column !important;flex-wrap:nowrap !important;
    padding:10px 10px 92px !important;margin:0 !important}
  /* 角色卡片从 72px 方块改成一整行：左边大图，右边名字，最好认也最好点 */
  html.kid-view-sprite [class*="sprite-selector_sprite-wrapper_"]{
    width:100% !important;min-width:0 !important;max-width:none !important;
    height:78px !important;min-height:78px !important;margin:0 0 8px !important}
  html.kid-view-sprite [class*="sprite-selector-item_sprite-selector-item_"]{
    flex-direction:row !important;align-items:center !important;
    background:#fff !important;border-radius:16px !important;
    border:2px solid rgba(92,80,140,.12) !important;
    box-shadow:0 2px 6px rgba(80,66,140,.07) !important}
  html.kid-view-sprite [class*="sprite-selector-item_is-selected_"]{
    border-color:#6E56CF !important;box-shadow:0 0 0 3px rgba(110,86,207,.22) !important}
  html.kid-view-sprite [class*="sprite-selector-item_sprite-image-outer_"]{
    flex:0 0 64px !important;width:64px !important;height:64px !important;margin-left:6px !important}
  html.kid-view-sprite body [class*="sprite-selector-item_sprite-image_"]{
    max-width:52px !important;max-height:52px !important}
  html.kid-view-sprite [class*="sprite-selector-item_sprite-info_"]{
    flex:1 1 auto !important;text-align:left !important;padding:0 12px !important;
    background:transparent !important;color:#3C3A52 !important}
  html.kid-view-sprite [class*="_sprite-name_"]{
    font-size:15px !important;font-weight:700 !important;line-height:1.4 !important}
  html.kid-view-sprite [class*="_sprite-details_"]{font-size:11px !important;opacity:.6}
  html.kid-view-sprite [class*="sprite-selector-item_is-selected_"] [class*="_sprite-name_"]{
    color:#4B33B8 !important}
  /* 选中角色右上角那个小叉：位置摆正，别压住卡片 */
  html.kid-view-sprite [class*="sprite-selector-item_delete-button_"]{
    top:50% !important;right:10px !important;transform:translateY(-50%) !important}
  /* 底部「背景」横条：点一下就去改背景 */
  html.kid-view-sprite [class*="target-pane_stage-selector-wrapper_"]{
    flex:0 0 auto !important;width:100% !important;height:84px !important;
    margin:0 !important;padding:8px 10px 10px !important}
  html.kid-view-sprite [class*="stage-selector_stage-selector_"]{
    flex-direction:row !important;align-items:center !important;
    width:100% !important;height:100% !important;overflow:hidden !important;
    background:#fff !important;border-radius:16px !important;
    border:2px solid rgba(92,80,140,.12) !important;
    box-shadow:0 2px 6px rgba(80,66,140,.07) !important}
  html.kid-view-sprite [class*="stage-selector_header_"]{
    flex:0 0 72px !important;width:72px !important;height:100% !important;
    border:0 !important;border-radius:0 !important;background:transparent !important}
  html.kid-view-sprite [class*="stage-selector_header-title_"]{
    font-size:14px !important;font-weight:700 !important}
  html.kid-view-sprite [class*="stage-selector_costume-canvas_"]{
    flex:0 0 auto !important;max-width:92px !important;max-height:62px !important;
    margin:0 10px !important}
  html.kid-view-sprite [class*="stage-selector_label_"]{
    margin:0 !important;font-size:13px !important;font-weight:700 !important;color:#3C3A52 !important}
  html.kid-view-sprite [class*="stage-selector_count_"]{
    padding:2px 8px !important;font-size:11px !important;color:#7A7396 !important}
  /* 右侧小箭头：告诉孩子这一条是可以点的 */
  html.kid-view-sprite [class*="stage-selector_stage-selector_"]::after{
    content:"›";margin-left:auto;padding-right:14px;font-size:22px;line-height:1;
    color:#B9B2D0;font-weight:400}
  html.kid-view-sprite [class*="stage-selector_add-button_"]{display:none !important}
  /* 「添加角色」做成右下角的大圆按钮，小孩一眼看到 */
  html.kid-view-sprite [class*="sprite-selector_add-button_"]{
    position:fixed !important;right:14px !important;bottom:96px !important;
    left:auto !important;top:auto !important;
    width:60px !important;height:60px !important;z-index:9100 !important}
  html.kid-view-sprite [class*="sprite-selector_add-button_"] button[class*="action-menu_main-button_"]{
    width:60px !important;height:60px !important;border-radius:50% !important;
    background:#6E56CF !important;box-shadow:0 6px 18px rgba(70,52,150,.35) !important}
  html.kid-view-sprite [class*="sprite-selector_add-button_"] img{
    width:30px !important;height:30px !important;margin:0 auto !important}

  /* ═══ 视图三：舞台（全屏铺开）══════════════════════════ */
  html.kid-view-stage [class*="stage-and-target-wrapper_"]{
    position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;
    z-index:9000 !important;margin:0 !important;padding:0 !important;
    display:flex !important;flex-direction:column !important;background:#141428 !important}
  html.kid-view-stage [class*="stage-header_stage-header-wrapper_"]{display:none !important}
  html.kid-view-stage [class*="stage-wrapper_stage-wrapper_"]{
    flex:1 1 auto !important;width:100% !important;height:auto !important;min-height:0 !important;
    padding:6px !important;box-sizing:border-box !important;
    display:flex !important;align-items:center !important;justify-content:center !important}
  html.kid-view-stage [class*="stage-canvas-wrapper_"]{
    width:100% !important;height:100% !important;min-height:0 !important;padding:0 !important;
    display:flex !important;align-items:center !important;justify-content:center !important}
  html.kid-view-stage [class*="stage_stage-wrapper_"]{
    width:100% !important;height:100% !important;padding:0 !important;
    display:flex !important;align-items:center !important;justify-content:center !important}
  /* 舞台本身是固定 480×360（或 408×306）的位图，这里整体等比缩放铺进屏幕，
     保证四个角都在屏幕里，不会再有「最右边差一截」。 */
  html.kid-view-stage [class^="stage_stage_"]{
    flex:0 0 auto !important;margin:0 !important;
    transform-origin:center center !important}
  html.kid-view-stage [class*="gui_target-wrapper_"]{display:none !important}

  /* 竖屏时积木栏会吃掉一大半宽度，提示孩子把手机横过来 */
  #kidRotate{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    display:none;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
    background:rgba(52,47,75,.88);color:#fff;z-index:60;pointer-events:none;
    font:12px/1 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;white-space:nowrap}
  @media (orientation:portrait){
    html.kid-view-code #kidRotate{display:flex}
  }

  /* 删角色前的确认：小孩误点一下就把角色弄丢，太心疼了 */
  #kidConfirm{position:fixed;inset:0;z-index:99999;display:none;
    align-items:center;justify-content:center;background:rgba(28,24,48,.5);
    font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
  #kidConfirm .box{width:268px;padding:20px 18px 14px;border-radius:18px;background:#fff;
    box-shadow:0 18px 44px rgba(0,0,0,.28);text-align:center}
  #kidConfirm .t{font-size:14px;line-height:1.6;color:#3C3A52;margin-bottom:6px}
  #kidConfirm .row{display:flex;gap:10px;margin-top:14px}
  #kidConfirm button{flex:1;height:42px;border-radius:12px;border:0;font-size:14px;
    font-weight:700;font-family:inherit}
  #kidConfirm #kidConfirmNo{background:#F2F0FA;color:#5C5580}
  #kidConfirm #kidConfirmYes{background:#F0616B;color:#fff}
</style>
</head>
<body>
<div id="boot"><div class="sp"></div><div id="bootTxt">创作室正在准备…</div></div>
<div id="kidRotate">↻ 把手机横过来，积木区会宽一倍</div>
<div id="kidConfirm">
  <div class="box">
    <div class="t" id="kidConfirmTxt">要删掉这个角色吗？</div>
    <div class="row">
      <button id="kidConfirmNo">留着</button>
      <button id="kidConfirmYes">删掉</button>
    </div>
  </div>
</div>
<div id="scratch"></div>

<!-- 离线素材表：背景 / 角色 / 声音全部内置，官方 CDN 在国内连不上 -->
<script src="local-assets.js"></script>
<script>
/* ── 1. 素材请求拦截 ──────────────────────────────────────
   Scratch 取素材统一走 .../internalapi/asset/<文件名>/get/，
   这里直接换成本地 data URI，既不用联网，也绕开 file:// 的跨域限制。 */
(function () {
  var A = window.__SCRATCH_LOCAL_ASSETS || {};
  // 大小写索引：Scratch 有时用 .svg，有时用 .SVG 请求同一份素材
  var INDEX = {};
  Object.keys(A).forEach(function (k) { INDEX[k.toLowerCase()] = A[k]; });
  window.__kidAssetHit = 0;
  window.__kidAssetMiss = [];

  function localAsset(url) {
    if (!url) return null;
    var s = String(url);
    if (s.indexOf('data:') === 0) return s;
    // 两种请求形式都要认：
    //   ① https://cdn.assets.../internalapi/asset/<md5ext>/get/   （素材库缩略图）
    //   ② 相对路径 <md5ext>                                        （点了素材真正加载时）
    var m = s.match(/\/internalapi\/asset\/([^\/?#]+)/) ||
            s.match(/([a-f0-9]{32}\.[a-z0-9]+)(?:[?#]|$)/i);
    if (!m) return null;
    var k = decodeURIComponent(m[1]);
    if (A[k]) return A[k];
    var low = INDEX[k.toLowerCase()];
    if (!low) window.__kidAssetMiss.push(k);
    return low || null;
  }
  function toBytes(dataUri) {
    var body = dataUri.slice(dataUri.indexOf(',') + 1);
    var bin = atob(body);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // 供后面的桥接脚本复用（同一个页面里两个 IIFE）
  window.__kidToBytes = toBytes;
  window.__kidLocalAsset = localAsset;

  function mimeOf(name) {
    var clean = String(name).split('?')[0].split('/').pop() || '';
    var e = (clean.split('.').pop() || '').toLowerCase();
    return ({svg:'image/svg+xml', png:'image/png', wav:'audio/wav', mp3:'audio/mpeg',
             jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif'})[e] || 'application/octet-stream';
  }

  if (window.fetch) {
    var rawFetch = window.fetch;
    window.fetch = function (input, init) {
      try {
        var url = typeof input === 'string' ? input : (input && input.url);
        var hit = localAsset(url);
        if (hit) {
          window.__kidAssetHit++;
          return Promise.resolve(new Response(toBytes(hit), {
            status: 200,
            headers: {'Content-Type': mimeOf(url)}
          }));
        }
      } catch (e) {}
      return rawFetch.apply(window, arguments);
    };
  }

  // 部分 WebView 里 scratch-storage 仍走 XHR，兜一层
  var rawOpen = XMLHttpRequest.prototype.open;
  var rawSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__kidUrl = url;
    return rawOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    var hit = localAsset(this.__kidUrl);
    if (hit) {
      var self = this, buf = toBytes(hit).buffer;
      try {
        Object.defineProperty(self, 'responseType', {value: 'arraybuffer', configurable: true});
        Object.defineProperty(self, 'status', {value: 200, configurable: true});
        Object.defineProperty(self, 'readyState', {value: 4, configurable: true});
        Object.defineProperty(self, 'response', {value: buf, configurable: true});
        setTimeout(function () {
          if (self.onreadystatechange) self.onreadystatechange();
          if (self.onload) self.onload();
          if (self.onloadend) self.onloadend();
        }, 0);
        return;
      } catch (e) {}
    }
    return rawSend.apply(this, arguments);
  };
})();
</script>

<script src="scratch-gui-standalone.js"></script>
<script>
/* ── 2. 与 App 的桥 ───────────────────────────────────────
   消息类型：ready / vmReady / saveBegin / saveChunk / saveEnd /
             saveResult / loadResult / runResult / viewChanged /
             targetChanged / error */
(function () {
  var lesson = null;
  var cachedVm = null;
  var pendingLoad = null;          // 编辑器还没起来时先存着，等 VM 就绪再灌
  var dirty = false;
  var autoTimer = null;
  var saveSeq = 0;
  var view = 'code';
  var lastTargetKey = '';

  function post(o) {
    try {
      if (window.KidCodingBridge) window.KidCodingBridge.postMessage(JSON.stringify(o));
    } catch (e) {}
  }
  function bootTxt(t) {
    var el = document.getElementById('bootTxt');
    if (el) el.textContent = t;
  }
  function hideBoot() {
    var el = document.getElementById('boot');
    if (el) el.style.display = 'none';
  }
  function closest(el, sel) {
    while (el && el.nodeType === 1) {
      try { if (el.matches(sel)) return el; } catch (e) {}
      el = el.parentElement;
    }
    return null;
  }
  function getVm() {
    if (cachedVm) return cachedVm;
    try {
      var st = window.scratchState;
      var v = st && st.store && st.store.getState().scratchGui.vm;
      if (v) cachedVm = v;
      return v || null;
    } catch (e) {
      return null;
    }
  }
  function whenVm(cb, tries) {
    var n = tries || 0;
    var v = getVm();
    if (v) { cb(v); return; }
    if (n > 250) { post({type: 'error', message: '编辑器启动超时'}); return; }
    setTimeout(function () { whenVm(cb, n + 1); }, 120);
  }
  /* 素材真正装进造型 / 声音时走的是 storage.load(assetType, assetId, dataFormat)，
     不产生网络请求，fetch / XHR 都拦不到，所以要在这一层接本地素材。 */
  function localAssetForId(assetId, dataFormat) {
    var A = window.__SCRATCH_LOCAL_ASSETS || {};
    var id = String(assetId || '');
    var keys = [id, id + '.' + String(dataFormat || '').toLowerCase()];
    if (id.indexOf('.') < 0) {
      keys.push(id + '.svg', id + '.png', id + '.wav', id + '.mp3');
    }
    for (var i = 0; i < keys.length; i++) {
      if (A[keys[i]]) return A[keys[i]];
    }
    var low = id.toLowerCase();
    for (var k in A) {
      if (k.split('.')[0] === low) return A[k];
    }
    return null;
  }

  function useLocalAssetStorage(storage) {
    if (!storage || storage.__kidPatched) return;
    var raw = storage.load.bind(storage);
    storage.load = function (assetType, assetId, dataFormat) {
      try {
        var d = localAssetForId(assetId, dataFormat);
        if (d) {
          var bytes = (window.__kidToBytes || toBytes)(d);
          return Promise.resolve(new GUI.Asset(assetType, assetId, dataFormat, bytes));
        }
      } catch (e) {}
      return raw(assetType, assetId, dataFormat);
    };
    storage.__kidPatched = true;
  }

  function bytesToB64(bytes) {
    var bin = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* ── 视图切换：积木 / 角色 / 舞台 ──────────────────────────
     手机上「积木区 + 舞台区」并排放不下（需要 1024px 宽），屏幕只有 780，
     所以一次只给一屏内容，用 App 顶栏的三个按钮切换：
       code   —— 只有积木，宽度和高度全部给它
       sprite —— 全屏角色列表，点一下角色就回去改它
       stage  —— 舞台单独铺满屏幕，等比缩放，四角都在屏幕内
     切换后要主动触发一次 resize，Blockly 和舞台渲染器才会按新尺寸重排。 */
  function stageEl() {
    var list = document.querySelectorAll('[class^="stage_stage_"]');
    for (var i = 0; i < list.length; i++) {
      if (list[i].tagName === 'DIV') return list[i];
    }
    return document.querySelector('canvas');
  }
  /* 舞台被挪到屏幕外时（积木 / 角色视图），canvas 的绘制缓冲可能被算成 0×0，
     切回来看效果就是一片白。这里按舞台当前的内框尺寸重新分配缓冲并重画。 */
  function hardRefreshStage() {
    var v = getVm();
    var st = stageEl();
    if (!v || !v.renderer || !st) return;
    var w = st.clientWidth || 0, h = st.clientHeight || 0;
    if (!(w > 10) || !(h > 10)) return;
    try {
      v.renderer.resize(w, h);
      v.renderer.draw();
    } catch (e) {}
  }
  function fitStage() {
    var st = stageEl();
    if (!st) return;
    if (view !== 'stage') {
      st.style.removeProperty('transform');
      return;
    }
    // offsetWidth/offsetHeight 是未经 transform 的布局尺寸（480×360 或 408×306）
    var w = st.offsetWidth || 480, h = st.offsetHeight || 360;
    var vw = window.innerWidth || 780, vh = window.innerHeight || 360;
    var k = Math.min((vw - 12) / w, (vh - 12) / h);
    if (!(k > 0.1)) k = 1;
    st.style.setProperty('transform', 'scale(' + k.toFixed(4) + ')', 'important');
  }
  function relayout() {
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    try {
      var ws = window.Blockly && window.Blockly.getMainWorkspace && window.Blockly.getMainWorkspace();
      if (ws && ws.resize) ws.resize();
    } catch (e) {}
    if (view === 'stage') hardRefreshStage();
    fitStage();
    setTimeout(fitStage, 120);
    setTimeout(function () {
      if (view === 'stage') hardRefreshStage();
      fitStage();
    }, 420);
  }
  function setView(next, silent) {
    view = (next === 'sprite' || next === 'stage') ? next : 'code';
    var root = document.documentElement;
    root.classList.toggle('kid-view-code', view === 'code');
    root.classList.toggle('kid-view-sprite', view === 'sprite');
    root.classList.toggle('kid-view-stage', view === 'stage');
    setTimeout(relayout, 30);
    setTimeout(relayout, 320);
    if (!silent) post({type: 'viewChanged', view: view});
  }
  window.addEventListener('resize', function () {
    // 手机转屏 / 键盘弹起后重新贴合
    setTimeout(fitStage, 60);
    setTimeout(fitStage, 300);
    setTimeout(function () {
      if (view === 'stage') hardRefreshStage();
      fitStage();
    }, 600);
  });

  /* ── 角色视图里的交互 ─────────────────────────────────────
     1) 点某个角色 / 背景，就回到积木视图去改它（孩子少一步操作）
     2) 点角色右上角的小叉，先问一句再删，避免误触丢角色 */
  function targetOf(el) {
    return closest(el, '[class*="sprite-selector_sprite-wrapper_"],' +
                         '[class*="stage-selector_stage-selector_"]');
  }
  var pendingDel = null;
  /* Scratch 自己的删除确认是个贴着角色卡片的小气泡，两个纯图标按钮（垃圾桶 / 撤销箭头），
     手机上既难点又看不懂，而且它的 z-index 比角色层低，会被盖住。
     做法：× 先照常点下去（让 Scratch 打开它的气泡），我们随即盖上自己这套大字确认框，
     回答「留着 / 删掉」后再去点它那两个按钮，走它原本的删除流程。 */
  function askDelete(btn) {
    var card = closest(btn, '[class*="sprite-selector_sprite-wrapper_"]');
    var nameEl = card && card.querySelector('[class*="_sprite-name_"]');
    var name = nameEl ? String(nameEl.textContent || '').trim() : '';
    var txt = document.getElementById('kidConfirmTxt');
    if (txt) {
      txt.textContent = name
        ? ('要删掉「' + name + '」吗？删掉就找不回来啦')
        : '要删掉这个角色吗？删掉就找不回来啦';
    }
    pendingDel = btn;
    var box = document.getElementById('kidConfirm');
    if (box) box.style.display = 'flex';
  }
  function hideConfirm() {
    var box = document.getElementById('kidConfirm');
    if (box) box.style.display = 'none';
    pendingDel = null;
  }
  function answerDelete(yes) {
    var btn = scratchPromptBtn(yes ? 'confirm' : 'cancel');
    hideConfirm();
    if (btn) { try { btn.click(); } catch (e) {} }
  }
  function scratchPromptBtn(kind) {
    return document.querySelector('[class*="confirmation-prompt_' + kind + '-button_"]');
  }
  (function bindConfirm() {
    var box = document.getElementById('kidConfirm');
    var no = document.getElementById('kidConfirmNo');
    var yes = document.getElementById('kidConfirmYes');
    if (no) no.addEventListener('click', function () { answerDelete(false); });
    if (yes) yes.addEventListener('click', function () { answerDelete(true); });
    // 点暗处 = 留着
    if (box) box.addEventListener('click', function (e) {
      if (e.target === box) answerDelete(false);
    });
  })();

  document.addEventListener('click', function (e) {
    if (view !== 'sprite') return;
    var del = closest(e.target, '[class*="sprite-selector-item_delete-button_"]');
    if (!del) return;
    askDelete(del);
  }, true);

  // 「+」直接开素材库，不要先弹一排小图标：小孩看不懂也不想点两下
  document.addEventListener('click', function (e) {
    if (view !== 'sprite') return;
    var main = closest(e.target,
        '[class*="sprite-selector_add-button_"] [class*="action-menu_main-button_"]');
    if (!main || main.__kidPass) return;
    e.preventDefault();
    e.stopPropagation();
    var items = document.querySelectorAll(
        '[class*="sprite-selector_add-button_"] [class*="action-menu_more-buttons_"] li button');
    if (items.length) {
      items[items.length - 1].click();   // 第 4 项 = 从素材库选择
    } else {
      main.__kidPass = true;
      try { main.click(); } catch (err) {}
      main.__kidPass = false;
    }
  }, true);

  // 选中角色 / 背景后自动回到积木视图
  document.addEventListener('click', function (e) {
    if (view !== 'sprite') return;
    if (closest(e.target, '[class*="action-menu"]')) return;
    if (closest(e.target, '[class*="delete-button"]')) return;
    var card = targetOf(e.target);
    if (!card) return;
    setTimeout(function () { setView('code'); }, 320);
  });

  /* 当前在改哪个角色：顶栏要显示，不然积木视图里看不出在给谁编程 */
  function reportTarget() {
    var v = getVm();
    if (!v || !v.runtime) return;
    var name = '', isStage = false, count = 0;
    try {
      var t = v.runtime.getEditingTarget ? v.runtime.getEditingTarget() : null;
      if (t) {
        name = t.getName ? t.getName() : (t.sprite && t.sprite.name) || '';
        isStage = !!t.isStage;
      }
      var list = v.runtime.targets || [];
      for (var i = 0; i < list.length; i++) if (!list[i].isStage) count++;
    } catch (e) {}
    var key = name + '|' + isStage + '|' + count;
    if (key === lastTargetKey) return;
    lastTargetKey = key;
    post({type: 'targetChanged', name: name, isStage: isStage, count: count});
  }

  /* ── 保存：作品可能有几 MB，切成小段回传，避免一次消息过大被丢掉 ── */
  var saving = false;

  function doSave(reason) {
    var v = getVm();
    // 同一时间只跑一次保存：自动保存和手动保存撞在一起会拼出坏文件
    if (saving) return;
    if (!v) {
      post({type: 'saveResult', ok: false, message: '编辑器还没准备好，再等一下'});
      return;
    }
    var empty = true;
    try { empty = !v.runtime.targets || v.runtime.targets.length === 0; } catch (e) {}
    if (empty) {
      post({type: 'saveResult', ok: false, message: '舞台上还没有东西，先加个角色吧'});
      return;
    }
    var id = ++saveSeq;
    saving = true;
    bootTxt('正在保存作品…');
    v.saveProjectSb3().then(function (blob) {
      return blob.arrayBuffer();
    }).then(function (buf) {
      var b64 = bytesToB64(new Uint8Array(buf));
      var CH = 160 * 1024;
      var total = Math.max(1, Math.ceil(b64.length / CH));
      post({type: 'saveBegin', id: id, total: total, bytes: b64.length, reason: reason || 'manual'});
      for (var i = 0; i < total; i++) {
        post({type: 'saveChunk', id: id, seq: i, data: b64.slice(i * CH, (i + 1) * CH)});
      }
      post({type: 'saveEnd', id: id, total: total});
      saving = false;
    }).catch(function (e) {
      saving = false;
      post({type: 'saveResult', ok: false, message: String((e && e.message) || e)});
    });
  }

  function markDirty() {
    dirty = true;
    if (autoTimer) clearTimeout(autoTimer);
    // 停手 4 秒就自动存一次：孩子不会记得点保存
    autoTimer = setTimeout(function () {
      if (!dirty) return;
      dirty = false;
      doSave('auto');
    }, 4000);
  }

  /* 屏幕全空是最劝退的：先给一个能点绿旗就跑的起步作品。 */
  function loadStarter(v) {
    var data = (window.__SCRATCH_LOCAL_ASSETS || {})['__starter.sb3'];
    if (!data) return;
    try {
      var bytes = b64ToBytes(data.slice(data.indexOf(',') + 1));
      v.stopAll();
      v.loadProject(bytes.buffer).then(function () {
        post({type: 'starterLoaded'});
      }).catch(function (e) {
        post({type: 'error', message: '起步作品加载失败：' + e});
      });
    } catch (e) {}
  }

  function applyLoad(b64) {
    whenVm(function (v) {
      v.stopAll();
      bootTxt('正在打开作品…');
      v.loadProject(b64ToBytes(b64).buffer).then(function () {
        pendingLoad = null;
        hideBoot();
        post({type: 'loadResult', ok: true});
        post({type: 'ready', engine: 'scratch3'});
      }).catch(function (e) {
        post({type: 'loadResult', ok: false, message: String((e && e.message) || e)});
      });
    });
  }

  try {
    var storage = new GUI.ScratchStorage();
    var configFactory = function () {
      return {storage: {scratchStorage: storage, saveProject: function () { return Promise.resolve({id: null}); }}};
    };
    var state = new GUI.EditorState({
      locale: 'zh-cn', isEmbedded: false, showTelemetryModal: false,
      isFullScreen: false, isPlayerOnly: false
    }, configFactory);
    window.scratchState = state;
    if (GUI.setAppElement) GUI.setAppElement(document.body);
    window.scratchRoot = GUI.createStandaloneRoot(state, document.getElementById('scratch'));
    window.scratchRoot.render({isEmbedded: false, isFullScreen: false, isPlayerOnly: false});
    hideBoot();
    post({type: 'ready', engine: 'scratch3'});
  } catch (e) {
    bootTxt('创作室加载失败：' + e);
    post({type: 'error', message: String(e)});
  }

  whenVm(function (v) {
    try {
      useLocalAssetStorage(v.runtime.storage);
    } catch (e) {}
    try {
      v.on('PROJECT_CHANGED', markDirty);
    } catch (e) {}
    try {
      v.on('targetsUpdate', reportTarget);
    } catch (e) {}
    try {
      v.on('PROJECT_RUN_STOP', reportTarget);
    } catch (e) {}
    post({type: 'vmReady', engine: 'scratch3', ok: true});
    // 等一小会儿：如果 App 那边有存过的作品，让它先灌进来，别和起步作品打架
    setTimeout(function () {
      if (pendingLoad) { applyLoad(pendingLoad); return; }
      var empty = true;
      try { empty = !v.runtime.targets || v.runtime.targets.length === 0; } catch (e) {}
      if (empty) loadStarter(v);
      setTimeout(relayout, 600);
      setTimeout(reportTarget, 900);
    }, 900);
  });

  // 切到后台 / 退出前，尽量把现场存下来
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) doSave('auto');
  });

  window.KidCoding = {
    setLesson: function (raw) {
      lesson = typeof raw === 'string' ? JSON.parse(raw) : raw;
      post({type: 'ready', engine: 'scratch3', lessonId: (lesson && lesson.id) || ''});
    },
    loadProject: function (b64) {
      if (!b64) {
        pendingLoad = null;
        post({type: 'loadResult', ok: true, empty: true});
        return;
      }
      pendingLoad = b64;
      applyLoad(b64);
    },
    requestSave: function (reason) { doSave(reason || 'manual'); },
    newProject: function () {
      var v = getVm();
      if (!v) return;
      loadStarter(v);
    },
    setView: function (v) { setView(v, true); },
    view: function () { return view; },
    /* App 换了顶栏高度，WebView 视口跟着变，要重新贴合一次 */
    relayout: function () { relayout(); },
    /* 开始：先切到「舞台」再跑，孩子一定看得到 */
    run: function () {
      var v = getVm();
      if (!v) { post({type: 'runResult', ok: false, message: '编辑器还没准备好'}); return; }
      setView('stage', true);
      setTimeout(function () {
        try { v.stopAll(); v.greenFlag(); } catch (e) {}
        post({type: 'runResult', ok: true});
      }, 260);
    },
    greenFlag: function () {
      var v = getVm();
      if (!v) { post({type: 'runResult', ok: false, message: '编辑器还没准备好'}); return; }
      v.stopAll();
      v.greenFlag();
      post({type: 'runResult', ok: true});
    },
    stopAll: function () {
      var v = getVm();
      if (v) v.stopAll();
      post({type: 'runResult', ok: true, stopped: true});
    },
    /* 角色视图里点了「背景」：选中舞台，回积木视图改背景 */
    editStage: function () {
      var el = document.querySelector('[class*="stage-selector_stage-selector_"]');
      if (el) el.click();
      setView('code');
    },
    stats: function () {
      return JSON.stringify({hit: window.__kidAssetHit, vm: !!getVm(),
                             view: view, target: lastTargetKey});
    }
  };
  setView('code', true);
})();
</script>
</body>
